# Simple workflow for building MkDocs and deploying to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configura Python sulla macchina virtuale
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 2. Installa MkDocs e il tema Material (definito nel tuo mkdocs.yml)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      # 3. Compila la documentazione da 'documents/' alla cartella 'site/'
      - name: Build site
        run: mkdocs build

      # 4. Configura Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Carica la cartella site/ appena creata dall'Action
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      # 6. Pubblica su GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
